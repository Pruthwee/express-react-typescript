<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Express, React, Typescript, Less </title>
    <!-- SSR-ready meta tags for Azure Static Web Apps -->
    <meta name="description" content="Express React TypeScript application with SSR support for Azure">
    <meta name="robots" content="index, follow">
    <style>
        /* Skeleton screen styles for Azure Static Web Apps SSR */
        .skeleton-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .skeleton-header {
            height: 60px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .skeleton-content {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .skeleton-sidebar {
            width: 250px;
            height: 400px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 4px;
        }
        .skeleton-main {
            flex: 1;
            height: 400px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 4px;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>

<body>
    <!-- Server-side rendered content will be injected here by Express SSR middleware -->
    <!-- This div now supports both SSR (initial HTML from server) and CSR (hydration) -->
    <div id="root">
        <!-- Skeleton screen placeholder for Azure Static Web Apps SSR -->
        <!-- This provides meaningful initial HTML structure while server renders or client hydrates -->
        <div class="skeleton-container">
            <div class="skeleton-header" role="presentation" aria-label="Loading header"></div>
            <div class="skeleton-content">
                <div class="skeleton-sidebar" role="presentation" aria-label="Loading sidebar"></div>
                <div class="skeleton-main" role="presentation" aria-label="Loading main content"></div>
            </div>
        </div>
    </div>
    
    <!-- Fallback noscript content for SEO and accessibility -->
    <noscript>
        <div style="padding: 20px; text-align: center;">
            <h1>Express React TypeScript Application</h1>
            <p>This application requires JavaScript to be enabled for full functionality.</p>
            <p>Please enable JavaScript in your browser settings.</p>
        </div>
    </noscript>
</body>

</html>
